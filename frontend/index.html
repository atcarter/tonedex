<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pokeball.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Status-bar tint; matches the app bar's primary.main in both color modes -->
    <meta name="theme-color" content="#cc0000" />
    <!--
      Page color until the app mounts, so a reload doesn't flash the other
      mode; theme.ts background.default for the mode color-mode.js picks.
      :where() keeps these at body's specificity, so CssBaseline's later rule wins.
    -->
    <script src="/color-mode.js"></script>
    <style>
      body {
        background: #e8e8e8;
      }
      :where(html[data-color-mode="dark"]) body {
        background: #121212;
      }
    </style>
    <title>ToneDex</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
