services:
  db:
    # Pinned to a digest: mutable tags make dev environments non-reproducible.
    # To bump: docker buildx imagetools inspect postgres:15
    image: postgres:15@sha256:b0a199c49fa974cf5b18c0bafb128b8023142705b23235892821fa9ac2d2cbb8
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pokedex_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1

  redis:
    # To bump: docker buildx imagetools inspect redis:7-alpine
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    # AOF (Append-Only File) persistence: every write is fsynced to disk.
    # Without this, a container restart drops all queued and retried Sidekiq jobs.
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    volumes:
      - ./backend:/rails
      - backend_gems:/usr/local/bundle
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Override with Docker service names (these win over env_file values)
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
      RAILS_MAX_THREADS: 3
      DB_POOL: 3   # web only needs one connection per Puma thread
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2

  sidekiq:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: bundle exec sidekiq
    volumes:
      - ./backend:/rails
      - backend_gems:/usr/local/bundle
    env_file:
      - .env.local
    environment:
      # Override with Docker service names (these win over env_file values)
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
      SIDEKIQ_CONCURRENCY: 5
      DB_POOL: 5   # worker needs one connection per Sidekiq thread
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    depends_on:
      - backend
    mem_limit: 1g
    cpus: 2

volumes:
  postgres_data:
  redis_data:
  backend_gems:
