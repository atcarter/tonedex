version: 2

# minor-and-patch takes every non-major update; named groups take only majors.

updates:
  # Ruby gems (backend)
  - package-ecosystem: "bundler"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      dev-tools:
        patterns:
          - "brakeman"
          - "bundler-audit"
          - "standard"
          - "rspec*"
          - "factory_bot*"
          - "faker"
        update-types:
          - "major"

  # npm packages (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
        update-types:
          - "major"
      react-query:
        patterns:
          - "@tanstack/*"
        update-types:
          - "major"
      dev-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "typescript"
          - "eslint*"
          - "@eslint/*"
          - "prettier"
          - "playwright"
          - "@playwright/*"
        update-types:
          - "major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base image (backend); bump backend/.ruby-version in the same PR
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "backend"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
