name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 0"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Read-only checks against the live site and API, set as repository
      # variables so the deployment URLs stay out of the code.
      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
        run: npm run test:smoke

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-traces
          path: frontend/test-results/
