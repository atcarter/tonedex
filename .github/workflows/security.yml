name: Security

# No path filter on purpose: this is meant to become a required check, and a
# required check that skips never reports. The weekly run catches new CVEs in
# an unchanged image.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Full history so gitleaks can scan every commit in the push or PR range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-image:
    name: Production image (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same build as ci.yml's backend-image job. The weekly run pulls a fresh
      # base image and skips the layer cache, so the base stage's package
      # upgrade runs again and picks up new Debian fixes.
      - name: Build production image
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            args+=(--pull --no-cache)
          fi
          docker build "${args[@]}" --target production -t tonedex-backend:ci backend

      # trivy-action has no major tag (it is still 0.x), so it is pinned to its
      # latest release. v0.36.0 installs Trivy v0.70.0.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tonedex-backend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  trivy-config:
    name: Infrastructure config (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Misconfiguration scan of the Dockerfiles and the Terraform in infra/.
      # v0.36.0 installs Trivy v0.70.0.
      - name: Scan config for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
