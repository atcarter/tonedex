name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # Every Rails command boots the app, and the OmniAuth initializer fetches
    # the Google credentials at boot, so placeholders are needed throughout.
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: ci-test-secret
      GOOGLE_CLIENT_ID: placeholder
      GOOGLE_CLIENT_SECRET: placeholder
      SIDEKIQ_ALLOWED_EMAIL: ci@example.com

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokedex_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: Set up database
        run: bundle exec rails db:schema:load

      - name: Lint (standardrb)
        run: bundle exec standardrb --no-fix

      - name: Run RSpec (with coverage)
        env:
          COVERAGE: "1"
        run: bundle exec rspec --format progress

      - name: Scan for security vulnerabilities (Brakeman)
        run: bundle exec brakeman --no-pager

      - name: Scan gems for known vulnerabilities (bundler-audit)
        run: bin/bundler-audit check --update

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit tests (Vitest, with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Every API call is mocked, so Playwright's webServer (the Vite dev
      # server) is the whole stack. The VITE_* values stand in for the env file.
      - name: Run E2E tests
        env:
          VITE_GOOGLE_CLIENT_ID: placeholder
          VITE_API_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/

  # Builds the production image and proves it boots: the entrypoint runs
  # db:prepare against the service Postgres, then /up must answer 200. Host
  # networking lets the container reach the service ports on localhost.
  backend-image:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokedex_ci_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build --target production -t tonedex-backend:ci backend

      # The OmniAuth initializer fetches the Google values at boot, so the
      # placeholders are required even though nothing signs in.
      - name: Start production image
        run: |
          docker run -d --name backend-ci --network host \
            -e SECRET_KEY_BASE="$(openssl rand -hex 64)" \
            -e CORS_ORIGINS=https://example.com \
            -e HTTP_PORT=10000 \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/pokedex_ci_smoke \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e JWT_SECRET=ci-test-secret \
            -e GOOGLE_CLIENT_ID=placeholder \
            -e GOOGLE_CLIENT_SECRET=placeholder \
            -e SIDEKIQ_ALLOWED_EMAIL=ci@example.com \
            tonedex-backend:ci

      - name: Wait for /up to answer 200
        run: |
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl -s --max-time 5 -o /tmp/up.json -w '%{http_code}' http://localhost:10000/up || true)
            if [ "$status" = "200" ]; then
              echo "/up returned 200: $(cat /tmp/up.json)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/up did not return 200 within 60 seconds (last status: ${status:-none})"
          docker logs backend-ci
          exit 1
